[project]
name = "cli-md-notes"
version = "0.1.0"
description = "An interactive CLI tool that helps to create, edit and organize simple notes and markdown-based notes. "
readme = "README.md"
authors = [
    { name = "minorlu", email = "scherbodenis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
    "tomli>=2.5.0",
]

[project.scripts]
cli-md-notes = "cli_md_notes:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[app-config]
init-dir = "/home/minorlu/workspace/"